name: CatchYa CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/catchya-ios
      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/catchya-android

  database:
    name: Supabase migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase stack and apply migrations
        run: supabase start -x studio,imgproxy,vector
      - name: Run database tests
        run: npm run test:db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
